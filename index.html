<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Estimate whether a Roth or Pre-tax (Traditional) retirement contribution leaves you with more after-tax wealth."
    />
    <title>Retirement Tax Calculators</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- For Netlify Forms: Netlify finds this form when the site is built, so the app's "Send
         feedback" form (src/components/Feedback.jsx) can post to it. Never shown. -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <textarea name="message"></textarea>
      <input name="contact" />
      <input name="page" />
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
